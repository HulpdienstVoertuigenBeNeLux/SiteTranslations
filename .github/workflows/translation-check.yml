name: Translation Key Check

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  check-translations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run translation key comparison
        id: check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            python check/compare_lang_keys.py --discord-webhook "$DISCORD_WEBHOOK_URL"
          else
            python check/compare_lang_keys.py
          fi

      - name: Commit updated report
        run: |
          if git diff --quiet -- check/missing-keys-report.txt; then
            echo "No report changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add check/missing-keys-report.txt
          git commit -m "chore: update missing keys report [skip ci]"
          git push
