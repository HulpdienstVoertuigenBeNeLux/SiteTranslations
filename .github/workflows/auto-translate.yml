name: Auto Translate Missing Keys

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install deep-translator

      - name: Run auto-translate script
        run: python check/auto_translate.py

      - name: Create pull request with translated keys
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: |
            This PR was automatically generated by the auto-translate workflow.

            It fills in missing translation keys by machine-translating from `nl_NL.json` using Google Translate.

            **Please review all translations before merging** - machine translations may be inaccurate, especially for values containing HTML.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          
          if git diff --quiet -- lang/; then
            echo "No translation changes found. Closing PR if it exists."
            if gh pr view auto-translate --json state 2>/dev/null | grep -q "OPEN"; then
              gh pr close auto-translate
            fi
            git push origin --delete auto-translate 2>/dev/null || true
            exit 0
          fi

          # Always rebuild branch from latest main so stale commits are dropped.
          git checkout -B auto-translate origin/main
          git add lang/
          git commit -m "chore: auto-translate missing translation keys"
          git push -f origin auto-translate
          gh pr create \
            --title "Auto-translate: fill missing translation keys" \
            --body "$PR_BODY" \
            --base main \
            --head auto-translate 2>/dev/null || gh pr edit auto-translate --body "$PR_BODY"
